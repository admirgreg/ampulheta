<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ampulheta ASCII — papel de parede</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="glow"></canvas>
  <div id="ui">
    <button id="menuBtn" class="menuBtn" aria-label="Menu" aria-expanded="false" title="Menu (M)"><span></span><span></span><span></span></button>
    <nav id="panel" class="drawer" aria-hidden="true">
      <h2>Ampulheta ASCII</h2>
      <section><h3>Objeto</h3><div id="objList" class="list"></div></section>
      <section><h3>Animação</h3>
        <div class="two"><button id="flipBtn" title="Virar (espaço ou clique na ampulheta)">⟲ virar</button><button id="pause" title="Pausar (P)">⏸ pausar</button></div>
        <label class="field"><span>velocidade <output id="spdv">1.0×</output></span><input id="spd" type="range" min="0" max="4" step="0.1" value="1"></label>
        <label class="field"><span>areia</span><input id="lvl" type="range" min="0" max="1" step="0.005" value="0"></label>
        <label class="field"><span>timer</span>
          <select id="tmr">
            <option value="0">livre</option><option value="1">1 min</option><option value="5">5 min</option>
            <option value="25">25 min</option><option value="50">50 min</option><option value="pomo">pomodoro 25/5</option>
          </select>
        </label>
      </section>
      <section><h3>Visual</h3>
        <div class="list">
          <button id="pal" title="Trocar cor (C)">◐ cor</button>
          <button id="ramp" title="Trocar letras (R)">Aa letras</button>
          <button id="glowBtn" title="Brilho (G)">✦ brilho</button>
        </div>
      </section>
      <section><h3>Som</h3>
        <div class="list">
          <button id="tab" title="Opcional, só no navegador: reagir ao som de uma aba. No Wallpaper Engine o som do sistema é captado sozinho">♪ aba</button>
          <button id="aud" title="Reagir a um arquivo de áudio">♪ arquivo</button>
          <input id="audioFile" type="file" accept="audio/*" hidden>
        </div>
      </section>
      <section><h3>Tela</h3>
        <div class="two"><button id="fs" title="Tela cheia (F)">⛶ tela cheia</button><button id="rec" title="Gravar vídeo .webm">● gravar</button></div>
      </section>
      <footer>M menu · O próximo objeto · F tela cheia · Espaço virar · P pausar · C cor · R letras · G brilho · H esconder tudo</footer>
    </nav>
  </div>
  <script src="objects/ampulheta.js"></script>
  <script src="objects/vinil.js"></script>
  <script src="objects/chave.js"></script>
  <script src="objects/coroa.js"></script>
  <script>
    // Modo papel de parede (Lively Wallpaper etc.). Ajuste aqui:
    //   fps   = limite de quadros (30 poupa CPU)   cycle = troca de objeto a cada N s (0 = não troca)
    //   obj   = ampulheta | vinil | chave | coroa   pal = 0..4 (branco, verde, âmbar, ciano, vermelho)
    //   ramp  = 0..2   glow = 1/0   timer = 0 | 1 | 5 | 25 | 50 | pomo   hud = 1 mostra o canto de dados
    window.CONFIG={wallpaper:1,fps:30,cycle:90,obj:'ampulheta',pal:0,ramp:0,glow:1,timer:0,hud:0};
  </script>
  <script src="script.js"></script>
</body>
</html>
